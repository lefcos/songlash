<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Songlash — WebSocket test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
        #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; margin: 12px 0; }
        #log div { padding: 2px 0; }
        .join  { color: #197a19; }
        .leave { color: #a11; }
        .sys   { color: #888; font-style: italic; }
        .err   { color: #a11; font-weight: bold; }
        input, button { font-size: 16px; padding: 6px; }
        #message { width: 420px; }
        #players { border: 1px solid #ccc; padding: 8px; margin: 12px 0; }
        #players h3 { margin: 0 0 6px; font-size: 14px; text-transform: uppercase; color: #666; }
        #players ul { margin: 0; padding-left: 20px; }
    </style>
</head>
<body>
<h2>Songlash — WebSocket test</h2>

<div id="joinArea">
    <input id="username" placeholder="Your name" autocomplete="off" maxlength="10">
    <button id="joinBtn">Join</button>
</div>

<div id="players"><h3>Players (0)</h3><ul></ul></div>

<div id="log"></div>

<div id="chatArea" style="display:none">
    <input id="message" placeholder="Type a message" autocomplete="off">
    <button id="sendBtn">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
    const $ = id => document.getElementById(id);

    const log = (text, cls = '') => {
        const el = document.createElement('div');
        el.className = cls;
        el.textContent = text;
        $('log').append(el);
        el.scrollIntoView();
    };

    const renderPlayers = names => {
        $('players').querySelector('h3').textContent = `Players (${names.length})`;
        $('players').querySelector('ul').replaceChildren(...names.map(n => {
            const li = document.createElement('li');
            li.textContent = n;
            return li;
        }));
    };

    let client, username, joined = false;

    const showChat = () => {
        joined = true;
        $('joinArea').style.display = 'none';
        $('chatArea').style.display = 'block';
        $('message').focus();
    };

    const showJoinForm = () => {
        joined = false;
        $('joinArea').style.display = 'block';
        $('chatArea').style.display = 'none';
        $('username').focus();
    };

    $('joinBtn').onclick = () => {
        username = $('username').value.trim();
        if (!username) return;

        client = new StompJs.Client({
            brokerURL: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws',
            onConnect: () => {
                log('connected, requesting name "' + username + '"', 'sys');

                client.subscribe('/user/queue/errors', frame => {
                    const msg = JSON.parse(frame.body);
                    log('error: ' + msg.content, 'err');
                    if (!joined) {
                        showJoinForm();
                        client.deactivate();
                    }
                });

                client.subscribe('/topic/public', frame => {
                    const msg = JSON.parse(frame.body);

                    if (msg.type === 'JOIN') {
                        log(msg.sender + ' joined', 'join');
                        if (!joined && msg.sender === username) showChat();
                    } else if (msg.type === 'LEAVE') {
                        log(msg.sender + ' left', 'leave');
                    } else {
                        log(msg.sender + ': ' + msg.content);
                    }

                    if (msg.players) renderPlayers(msg.players);
                });

                client.publish({
                    destination: '/app/chat.addUser',
                    body: JSON.stringify({ sender: username, type: 'JOIN' })
                });
            },
            onStompError: frame => log('STOMP error: ' + frame.headers['message'], 'err'),
            onWebSocketClose: () => { log('disconnected', 'sys'); renderPlayers([]); }
        });
        client.activate();
    };

    const send = () => {
        const input = $('message');
        const content = input.value.trim();
        if (!content) return;
        client.publish({
            destination: '/app/chat.sendMessage',
            body: JSON.stringify({ content: content, type: 'CHAT' })
        });
        input.value = '';
    };

    $('sendBtn').onclick = send;
    $('message').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    $('username').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
</script>
</body>
</html>
