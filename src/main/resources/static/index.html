<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Songlash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 24px auto;
            padding: 12px;
            background: #f4f4f4;
            color: #222;
        }

        h2 {
            margin: 0 0 16px;
        }

        .panel {
            background: #fff;
            border: 1px solid #bbb;
            padding: 12px;
            margin: 12px 0;
        }

        input,
        button {
            font-size: 15px;
            padding: 6px 8px;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        #roomCode {
            width: 120px;
            text-transform: uppercase;
        }

        .sys {
            margin-top: 8px;
            color: #666;
            font-style: italic;
        }

        .err {
            color: #a11;
            font-weight: bold;
        }

        .ok {
            color: #1f7a1f;
        }
    </style>
</head>
<body>
<h2>Songlash</h2>

<div id="joinArea" class="panel">
    <input id="username" placeholder="Your name" maxlength="10" autocomplete="off">
    <button id="joinBtn">Sign in</button>
</div>

<div id="lobbyArea" class="panel" style="display:none;">
    <button id="createRoomBtn">Create game</button>
    <input id="roomCode" placeholder="4-letter code" maxlength="4" autocomplete="off">
    <button id="joinRoomBtn">Join game</button>
    <div id="roomStatus" class="sys"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
    const $ = id => document.getElementById(id);

    let client;
    let username = '';
    let joined = false;

    const showLobby = () => {
        $('joinArea').style.display = 'none';
        $('lobbyArea').style.display = 'block';
        $('roomStatus').textContent = 'Ready.';
        $('roomCode').focus();
    };

    const showJoin = () => {
        $('joinArea').style.display = 'block';
        $('lobbyArea').style.display = 'none';
        $('roomStatus').textContent = '';
        $('username').focus();
    };

    const setStatus = (text, cls = 'sys') => {
        const status = $('roomStatus');
        status.className = cls;
        status.textContent = text;
    };

    const roomCodeFromText = text => {
        const match = String(text || '').match(/\b([A-Z]{4})\b/);
        return match ? match[1] : null;
    };

    $('joinBtn').onclick = () => {
        username = $('username').value.trim();
        if (!username) {
            setStatus('Enter a name first.', 'err');
            return;
        }

        if (client) {
            client.deactivate();
        }

        client = new StompJs.Client({
            brokerURL: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws',
            onConnect: () => {
                client.subscribe('/user/queue/errors', frame => {
                    const msg = JSON.parse(frame.body);
                    setStatus(msg.content || 'Something went wrong.', 'err');
                    if (!joined) {
                        showJoin();
                        client.deactivate();
                    }
                });

                client.subscribe('/user/queue/room', frame => {
                    const msg = JSON.parse(frame.body);
                    const code = roomCodeFromText(msg.content);

                    if (msg.type === 'ROOM_CREATED' || msg.type === 'ROOM_JOINED') {
                        if (code) {
                            setStatus((msg.type === 'ROOM_CREATED' ? 'Game created: ' : 'Joined game: ') + code, 'ok');
                        } else {
                            setStatus(msg.content || '', 'ok');
                        }
                    } else {
                        setStatus(msg.content || '', 'sys');
                    }
                });

                client.subscribe('/topic/public', frame => {
                    const msg = JSON.parse(frame.body);

                    if (msg.type === 'JOIN' && msg.sender === username && !joined) {
                        joined = true;
                        showLobby();
                    }
                });

                client.publish({
                    destination: '/app/chat.addUser',
                    body: JSON.stringify({ sender: username, type: 'JOIN' })
                });
            },
            onStompError: frame => setStatus('STOMP error: ' + frame.headers['message'], 'err'),
            onWebSocketClose: () => {
                joined = false;
                showJoin();
            }
        });

        client.activate();
        setStatus('Connecting...', 'sys');
    };

    $('createRoomBtn').onclick = () => {
        if (!client) return;
        setStatus('Creating game...', 'sys');
        client.publish({
            destination: '/app/chat.createRoom',
            body: JSON.stringify({ type: 'CREATE_ROOM' })
        });
    };

    $('joinRoomBtn').onclick = () => {
        if (!client) return;

        const code = $('roomCode').value.trim().toUpperCase();
        if (code.length !== 4) {
            setStatus('Enter a 4-letter code.', 'err');
            return;
        }

        setStatus('Joining game ' + code + '...', 'sys');
        client.publish({
            destination: '/app/chat.joinRoom',
            body: JSON.stringify({ content: code, type: 'JOIN_ROOM' })
        });
    };

    $('username').addEventListener('keydown', e => {
        if (e.key === 'Enter') $('joinBtn').click();
    });

    $('roomCode').addEventListener('keydown', e => {
        if (e.key === 'Enter') $('joinRoomBtn').click();
    });
</script>
</body>
</html>
